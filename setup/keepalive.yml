name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"   # every 3 days, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the store database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://wmiarqmtymsrosuthouk.supabase.co/rest/v1/levels?select=id&limit=1" \
            -H "apikey: sb_publishable_m21sCQoERco9N2L8ue5kIg_NThf1pYG")
          echo "Supabase answered with HTTP $code"
          test "$code" = "200"
