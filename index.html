        <div class="grow"><div class="t">${esc(l)}</div><div class="m">${esc(d)}</div></div><span class="tag">${esc(num((S.resetCounts || {})[k] || 0))} رکورد</span></label>`).join("")}</div>
      <ol class="rs-steps"><li><b>نسخه پشتیبان:</b> <button type="button" class="btn sm alt" data-act="rs-backup">گرفتن نسخه پشتیبان (الزامی)</button> <span id="rsBk" class="hint"></span></li>
      <li><b>تأیید:</b> عبارت <code>حذف اطلاعات</code> را تایپ کنید و رمز حساب مدیر را وارد کنید.<div class="grid2" style="margin-top:8px"><input class="input" id="rsPhrase" placeholder="حذف اطلاعات" autocomplete="off"><input class="input" id="rsPass" type="password" placeholder="رمز عبور شما" autocomplete="current-password" dir="ltr"></div></li></ol>
      <button class="btn danger" data-act="rs-go" id="rsGo" disabled>پاک کردن بخش‌های انتخاب‌شده</button></div>`;
  };
})();
ACT["rs-backup"] = async el => {
  el.disabled = true; const s = document.getElementById("rsBk"); if (s) s.textContent = "در حال آماده‌سازی…";
  try { await ACT["bk-schema"](el); await ACT["bk-data"](el); S.resetBackupDone = true; if (s) s.textContent = "✓ schema.sql و data.json دانلود شدند"; }
  catch (e) { if (s) s.textContent = "خطا در پشتیبان‌گیری"; }
  el.disabled = false;
};
ACT["rs-go"] = async el => {
  const secs = [...document.querySelectorAll('input[name="rs"]:checked')].map(x => x.value);
  if (!secs.length) return toast("حداقل یک بخش را انتخاب کنید", true);
  if (!S.resetBackupDone) return toast("اول نسخه پشتیبان بگیرید", true);
  if ((document.getElementById("rsPhrase").value || "").trim() !== "حذف اطلاعات") return toast("عبارت تأیید را دقیق تایپ کنید", true);
  const pass = document.getElementById("rsPass").value;
  const ver = await sb.auth.signInWithPassword({ email: S.session.user.email, password: pass });
  if (ver.error) return toast("رمز عبور درست نیست", true);
  const names = secs.map(k => RESET_SECTIONS.find(x => x[0] === k)[1]).join("، ");
  if (!confirm(`آخرین هشدار: این بخش‌ها برای همیشه پاک می‌شوند:\n${names}\n\nاین کار برگشت‌پذیر نیست. ادامه می‌دهید؟`)) return;
  el.disabled = true;
  for (let n = 5; n > 0; n--) { el.textContent = `پاک‌سازی تا ${num(n)} ثانیه دیگر…`; await new Promise(r => setTimeout(r, 1000)); }
  const { data, error } = await sb.rpc("admin_reset_data", { _sections: secs, _confirm: "حذف اطلاعات" });
  if (error) { el.disabled = false; el.textContent = "پاک کردن بخش‌های انتخاب‌شده"; return toast(errMsg(error), true); }
  for (const k of secs) for (const b of (RESET_BUCKETS[k] || [])) await emptyBucket(b);
  toast("✓ پاک‌سازی انجام شد"); S.banners = null; S.cats = null; await refresh();
};
async function emptyBucket(bucket) {
  const all = [];
  async function walk(prefix) {
    for (let off = 0; ; off += 100) {
      const { data, error } = await sb.storage.from(bucket).list(prefix, { limit: 100, offset: off });
      if (error || !data || !data.length) break;
      for (const it of data) { const p = prefix ? prefix + "/" + it.name : it.name; if (it.id) all.push(p); else await walk(p); }
      if (data.length < 100) break;
    }
  }
  try { await walk(""); for (let i = 0; i < all.length; i += 100) await sb.storage.from(bucket).remove(all.slice(i, i + 100)); } catch (e) {}
}
document.addEventListener("change", e => {
  if (e.target.dataset && e.target.dataset.change === "rsCalc") { const b = document.getElementById("rsGo"); if (b) b.disabled = !document.querySelector('input[name="rs"]:checked'); }
});

<script>
/* ===== a deleted account still holding an old login is signed out with a clear message ===== */
(function guardDeletedAccount() {
  const orig = window.loadMe;
  let checking = false;
  window.loadMe = async function () {
    await orig();
    if (!S.session || S.profile || checking) return;
    checking = true;
    try {
      const { error } = await sb.auth.getUser();
      if (error) {
        await sb.auth.signOut();
        S.session = null; S.profile = null; S.isAdmin = false; S.isOwner = false; S.role = "user";
        openModal("حساب شما دیگر وجود ندارد", `<p>حساب کاربری‌ای که با آن وارد شده بودید از سایت حذف شده است. لطفاً دوباره ثبت‌نام کنید یا با حساب دیگری وارد شوید.</p>`,
          `<a class="btn" href="#/login" data-act="close-modal">ورود یا ثبت‌نام</a>`);
      }
    } finally { checking = false; }
  };
})();
</script>

Object.assign(ACT, {
  "db-go": (el, e) => { if (e && e.target.closest("button")) return; dbGo(el.dataset.tab); },
  "db-do": (el, e) => { if (e) e.stopPropagation(); const a = DB_ACTIONS[el.dataset.a]; if (a) dbGo(a[1], a[2]); },
  "db-style": async el => { S.dbPrefs.style = el.dataset.s; await dbSave(S.dbPrefs); render(); },
  "db-reset": async () => { S.dbPrefs = JSON.parse(JSON.stringify(DB_DEFAULT)); await dbSave(S.dbPrefs); render(); toast("داشبورد به حالت پیش‌فرض برگشت"); },
  "db-tg": async el => { S.dbPrefs.closed[el.dataset.g] = !S.dbPrefs.closed[el.dataset.g]; el.closest(".db-grp").classList.toggle("closed"); el.setAttribute("aria-expanded", !S.dbPrefs.closed[el.dataset.g]); await dbSave(S.dbPrefs); },
  "db-mv": async el => { const o = S.dbPrefs.order, i = o.indexOf(el.dataset.g), j = i + Number(el.dataset.d); if (j < 0 || j >= o.length) return; [o[i], o[j]] = [o[j], o[i]]; await dbSave(S.dbPrefs); render(); },
  "db-pin": async (el, e) => { if (e) e.stopPropagation(); const k = el.dataset.k, P = S.dbPrefs.pins; S.dbPrefs.pins = P.includes(k) ? P.filter(x => x !== k) : P.concat(k); await dbSave(S.dbPrefs); toast(S.dbPrefs.pins.includes(k) ? "به دسترسی سریع من اضافه شد" : "از دسترسی سریع برداشته شد"); render(); },
  "db-pins-edit": () => dbPinsModal(),
  "db-pe-mv": el => { const P = S.dbPinDraft, i = +el.dataset.i, j = i + Number(el.dataset.d); if (j < 0 || j >= P.length) return; [P[i], P[j]] = [P[j], P[i]]; dbPinsModal(true); },
  "db-pe-tg": el => { const k = el.dataset.k, P = S.dbPinDraft; S.dbPinDraft = P.includes(k) ? P.filter(x => x !== k) : P.concat(k); dbPinsModal(true); },
  "db-pe-save": async () => { S.dbPrefs.pins = S.dbPinDraft; await dbSave(S.dbPrefs); closeModal(); toast("دسترسی سریع من ذخیره شد"); render(); }
});
function pinLabel(k) { if (k.startsWith("s:")) return [t("a_" + k.slice(2)), "بخش", ADMIN_ICONS[k.slice(2)] || QI.gear]; const a = DB_ACTIONS[k.slice(2)]; return a ? [a[0], "اقدام سریع", a[3]] : [k, "", QI.gear]; }
function dbPinsModal(keep) {
  if (!keep) S.dbPinDraft = [...S.dbPrefs.pins];
  const P = S.dbPinDraft.filter(k => pinLabel(k)[1]);
  const secs = DB_GROUPS.flatMap(g => g[4].map(s => s[0])).filter(dbOk).map(id => "s:" + id), acts = Object.keys(DB_ACTIONS).filter(a => dbOk(DB_ACTIONS[a][1])).map(a => "a:" + a);
  const row = k => { const [l, kind, ic] = pinLabel(k), on = P.includes(k); return `<div class="pe-row"><span class="pe-ic">${qicon(ic)}</span><span class="pe-l">${esc(l)}<small>${esc(kind)}</small></span><button type="button" class="switch ${on ? "on" : ""}" data-act="db-pe-tg" data-k="${k}" aria-pressed="${on}" aria-label="${esc(l)}"></button></div>`; };
  const html = `<h3 class="pe-h">چیده‌شده (${esc(num(P.length))})</h3>
    ${P.length ? `<div class="pe-list">${P.map((k, i) => { const [l, kind, ic] = pinLabel(k); return `<div class="pe-row"><span class="pe-ic">${qicon(ic)}</span><span class="pe-l">${esc(l)}<small>${esc(kind)}</small></span>
      <span class="pe-mv"><button type="button" data-act="db-pe-mv" data-i="${i}" data-d="-1" aria-label="بالا" ${i === 0 ? "disabled" : ""}>▲</button><button type="button" data-act="db-pe-mv" data-i="${i}" data-d="1" aria-label="پایین" ${i === P.length - 1 ? "disabled" : ""}>▼</button></span>
      <button type="button" class="btn sm alt" data-act="db-pe-tg" data-k="${k}" aria-label="حذف ${esc(l)}">✕</button></div>`; }).join("")}</div>` : `<p class="hint">هنوز چیزی انتخاب نشده.</p>`}
    <details class="pe-add" open><summary>اقدام‌های سریع</summary><div class="pe-list">${acts.map(row).join("")}</div></details>
    <details class="pe-add"><summary>بخش‌ها</summary><div class="pe-list">${secs.map(row).join("")}</div></details>`;
  if (keep && document.getElementById("peBody")) { document.getElementById("peBody").innerHTML = html; return; }
  openModal("ویرایش دسترسی سریع من", `<div id="peBody">${html}</div>`, `<button class="btn alt" data-act="close-modal">${esc(t("cancel"))}</button><button class="btn" data-act="db-pe-save">${esc(t("save"))}</button>`);
}
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('.db-it[role="link"],.db-it[role="button"]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener("toggle", async e => { if (e.target.id === "dbRep" && S.dbPrefs) { S.dbPrefs.reports = e.target.open; await dbSave(S.dbPrefs); } }, true);
let dbW = innerWidth; addEventListener("resize", () => { if (S.dbPrefs && S.dbPrefs.style === "auto" && (dbW <= 700) !== (innerWidth <= 700) && /^#\/admin\/?(dashboard)?$/.test(location.hash)) render(); dbW = innerWidth; });
</script>

</body>
</html>
