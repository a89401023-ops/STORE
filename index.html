    </tbody></table></div>
    <h2 style="margin-top:18px">💸 ${esc(t("a_payout"))}</h2>
    <form data-form="a-payout" id="poform" data-id="${affId}">
      <div class="grid2"><div class="field"><label>${esc(t("a_payoutAmount"))}</label><input class="input" name="amount" type="number" min="1" max="${bal}" value="${bal > 0 ? bal : ""}" required dir="ltr"></div>
      <div class="field"><label>${esc(t("a_payoutMethod"))}</label><select class="input" name="method"><option value="wallet">${esc(t("po_wallet"))}</option><option value="manual">${esc(t("po_manual"))}</option></select></div></div>
      <div class="grid2"><div class="field"><label>${esc(t("a_reference"))}</label><input class="input" name="reference"></div><div class="field"><label>${esc(t("a_adminNote"))}</label><input class="input" name="note"></div></div>
    </form>
    ${d.P.length ? `<h2>${esc(t("payouts"))}</h2><div class="list">${d.P.map(p => `<div class="li"><div class="grow"><div class="t">${esc(money(p.amount))}</div><div class="m">${esc(fdate(p.created_at))}${sep()}${esc(t("po_" + p.method))}${p.reference ? sep() + esc(p.reference) : ""}</div></div></div>`).join("")}</div>` : ""}`,
    `<button class="btn alt" data-act="close-modal">${esc(t("close"))}</button>${bal > 0 ? `<button class="btn teal" type="submit" form="poform">${esc(t("a_payout"))}</button>` : ""}`);
}
EXPORTS.aff = async (affId) => { const d = await affLedgerData(affId); return { title: t("a_ledger") + " — " + (d.a?.full_name || "") + " (" + (d.a?.code || "") + ")", file: "partner-" + safeName(d.a?.code || "x"), sheets: ledgerSheets(d) }; };
EXPORTS.affiliates = async () => {
  const L = S.adminAffs || [], T = S.affTotals || {}, u = S.affUsers || {};
  return { title: t("a_affiliates"), file: "partners", sheets: [{ name: t("a_affiliates"), rows: L, columns: [
    { label: t("a_partner"), get: a => a.full_name || "" }, { label: t("a_contact"), get: a => loginLabel(u[a.user_id]) }, { label: t("phone"), get: a => a.phone || "" },
    { label: t("a_code"), get: a => a.code || "" }, { label: t("a_rateDefault"), get: a => a.default_type === "percent" ? pct(a.default_value) : money(a.default_value) },
    { label: t("salesCount"), get: a => Number((T[a.id] || {}).sales || 0), num: true, sum: true }, { label: t("earned"), get: a => Number((T[a.id] || {}).earned || 0), num: true, sum: true },
    { label: t("pendingComm"), get: a => Number((T[a.id] || {}).pending || 0), num: true, sum: true }, { label: t("paidOut"), get: a => Number((T[a.id] || {}).paid || 0), num: true, sum: true },
    { label: t("balanceDue"), get: a => Number((T[a.id] || {}).earned || 0) - Number((T[a.id] || {}).paid || 0), num: true, sum: true },
    { label: t("status"), get: a => t("as_" + a.status), filter: true }, { label: t("date"), get: a => fdate(a.created_at) }] }] };
};

/* ================= Users: roles, passwords, login IDs ================= */
A.users = async () => {
  const [{ data: U }, { data: R }, { data: L }] = await Promise.all([
    sb.from("profiles").select("*").order("created_at", { ascending: false }).limit(2000),
    sb.from("user_roles").select("user_id,role").in("role", ["admin", "staff"]), sb.from("levels").select("id,name")]);
  S.adminUsers = U || [];
  const roles = {}; (R || []).forEach(r => { if (r.role === "admin" || !roles[r.user_id]) roles[r.user_id] = r.role; });
  const lv = {}; (L || []).forEach(l => lv[l.id] = l.name);
  const q = toEn(S.userQuery || "").toLowerCase();
  const list = S.adminUsers.filter(u => !q || [u.email, u.full_name, u.phone, u.login_id].some(v => toEn(v || "").toLowerCase().includes(q)));
  return `<p class="hint">${esc(t("a_roleHint"))}</p>
    <div class="toolbar"><input class="input" placeholder="${esc(t("a_search"))}" value="${esc(S.userQuery || "")}" data-input="userQuery" style="flex:1"><span class="btnrow">${exportButtons("users")}</span></div>
    <div class="table-wrap"><table><thead><tr><th>${esc(t("fullName"))}</th><th>${esc(t("a_contact"))}</th><th>${esc(t("balance"))}</th><th>${esc(t("level"))}</th><th>${esc(t("a_role"))}</th><th></th></tr></thead><tbody>
    ${list.map(u => `<tr><td>${esc(u.full_name || "—")}${u.phone && u.login_type !== "mobile" ? `<br><span class="hint" dir="ltr">${esc(u.phone)}</span>` : ""}</td><td dir="ltr">${esc(loginLabel(u))}</td>
      <td>${esc(money(u.wallet_balance))}</td><td>${esc(lv[u.level_id] || "—")}</td>
      <td><select class="input" data-change="setRole" data-id="${u.id}" style="width:auto" ${u.id === S.session.user.id ? "disabled" : ""}>${["user", "staff", "admin"].map(r => `<option value="${r}" ${(roles[u.id] || "user") === r ? "selected" : ""}>${esc(t("r_" + r))}</option>`).join("")}</select></td>
      <td style="white-space:nowrap"><button class="btn sm teal" data-act="a-adjust" data-id="${u.id}">${esc(t("a_adjust"))}</button>
      <button class="btn sm alt" data-act="a-userreport" data-id="${u.id}">📊</button>
      <button class="btn sm alt" data-act="a-setpass" data-id="${u.id}">🔑 ${esc(t("a_setPass"))}</button></td></tr>`).join("")}
    </tbody></table></div>`;
};
EXPORTS.users = async () => {
  const [{ data }, { data: L }, { data: O }] = await Promise.all([
    sb.from("profiles").select("*").order("created_at", { ascending: false }).limit(10000), sb.from("levels").select("id,name"), sb.from("orders").select("user_id").limit(20000)]);
  const lv = {}; (L || []).forEach(l => lv[l.id] = l.name); const oc = {}; (O || []).forEach(o => oc[o.user_id] = (oc[o.user_id] || 0) + 1);
  return { title: t("a_users"), file: "users", sheets: [{ name: t("a_users"), rows: data || [], columns: [
    { label: t("fullName"), get: r => r.full_name || "" }, { label: t("a_contact"), get: r => loginLabel(r) }, { label: t("phone"), get: r => r.phone || "" },
    { label: t("balance"), get: r => Number(r.wallet_balance), num: true, sum: true }, { label: t("totalSpent"), get: r => Number(r.total_spent), num: true, sum: true },
    { label: t("ordersCount"), get: r => oc[r.id] || 0, num: true }, { label: t("level"), get: r => lv[r.level_id] || "", filter: true }, { label: t("memberSince"), get: r => fdate(r.created_at) }] }] };
};
const _profileMapOrig = profileMap;
profileMap = async function (ids) {   // include login IDs so exports show mobile/messenger accounts
  const m = {}; ids = [...new Set(ids.filter(Boolean))];
  for (let i = 0; i < ids.length; i += 200) {
    const { data } = await sb.from("profiles").select("id,email,full_name,phone,login_type,login_id").in("id", ids.slice(i, i + 200));
    (data || []).forEach(p => { p.email = loginLabel(p); m[p.id] = p; });
  }
  return m;
};

/* ================= actions & forms ================= */
Object.assign(ACT, {
  "a-camp": el => campModal(el.dataset.id ? S.adminCampaigns.find(c => c.id === el.dataset.id) : null),
  "a-coupon": el => couponModal(el.dataset.id ? S.adminCoupons.find(c => c.id === el.dataset.id) : null),
  "a-campdel": async el => { if (!confirm(t("a_deleteConfirm"))) return; const { error } = await sb.from("campaigns").delete().eq("id", el.dataset.id); if (error) return toast(errMsg(error), true); closeModal(); await loadCampaigns(); renderPromo(); render(); },
  "a-coupondel": async el => { if (!confirm(t("a_deleteConfirm"))) return; const { error } = await sb.from("coupons").delete().eq("id", el.dataset.id); if (error) return toast(errMsg(error), true); closeModal(); render(); },
  "a-randcode": el => { const i = document.getElementById(el.dataset.target); if (i) i.value = randomCode(8); },
  "a-aff": el => affModal(S.adminAffs.find(a => a.id === el.dataset.id)),
  "a-affledger": el => affLedgerModal(el.dataset.id),
  "a-setpass": el => {
    const u = S.adminUsers.find(x => x.id === el.dataset.id) || {};
    openModal(`${t("a_setPass")} — ${u.full_name || ""}`, `<p class="hint" dir="ltr">${esc(loginLabel(u))}</p><form data-form="a-setpass" id="spform" data-id="${u.id}">
      <div class="field"><label>${esc(t("a_newPass"))}</label><input class="input" name="password" minlength="6" required dir="ltr" autocomplete="new-password"></div></form>`,
      `<button class="btn alt" data-act="close-modal">${esc(t("cancel"))}</button><button class="btn" type="submit" form="spform">${esc(t("save"))}</button>`);
  }
});
document.addEventListener("change", async e => {
  if (e.target.dataset.change !== "setRole") return;
  const { error } = await sb.rpc("admin_set_role", { _user_id: e.target.dataset.id, _role: e.target.value });
  if (error) { toast(errMsg(error), true); render(); } else toast(t("a_done"));
});
Object.assign(FORM, {
  "a-camp": async fd => {
    const c = S.editCamp || {};
    const payload = { title: fd.get("title").trim(), title_i18n: readI18n(fd, "title", c.title_i18n), message: (fd.get("message") || "").trim() || null,
      percent: Number(fd.get("percent")), applies_to: fd.get("applies_to"), starts_at: fromLocalInput(fd.get("starts_at")), ends_at: fromLocalInput(fd.get("ends_at")), is_active: fd.has("is_active") };
    if (new Date(payload.ends_at) <= new Date(payload.starts_at)) throw new Error(t("a_endsAt") + " > " + t("a_startsAt"));
    const { error } = c.id ? await sb.from("campaigns").update(payload).eq("id", c.id) : await sb.from("campaigns").insert(payload);
    if (error) throw error; closeModal(); toast(t("saved")); await loadCampaigns(); renderPromo(); render();
  },
  "a-coupon": async fd => {
    const k = S.editCoupon || {};
    const payload = { code: toEn(fd.get("code")).trim().toUpperCase().replace(/\s+/g, ""), kind: fd.get("kind"), value: Number(fd.get("value")), applies_to: fd.get("applies_to"),
      min_amount: parseInt(fd.get("min_amount") || "0", 10) || 0, max_uses: parseInt(fd.get("max_uses"), 10) || null, per_user_limit: parseInt(fd.get("per_user_limit"), 10) || null,
      ends_at: fromLocalInput(fd.get("ends_at")), is_active: fd.has("is_active") };
    const { error } = k.id ? await sb.from("coupons").update(payload).eq("id", k.id) : await sb.from("coupons").insert(payload);
    if (error) throw (error.code === "23505" ? new Error(t("err_CODE_TAKEN")) : error); closeModal(); toast(t("saved")); render();
  },
  "a-aff": async (fd, form) => {
    const a = S.editAff;
    const items = [...form.querySelectorAll(".affitem")].filter(r => r.querySelector('[name="inc"]').checked || r.querySelector('[name="rv"]').value)
      .map(r => ({ type: r.dataset.type, id: r.dataset.id, rate_type: r.querySelector('[name="rv"]').value ? r.querySelector('[name="rt"]').value || "percent" : "", rate: r.querySelector('[name="rv"]').value }));
    const { error } = await sb.rpc("admin_save_affiliate", { _aff_id: a.id, _status: fd.get("status"), _code: toEn(fd.get("code")).trim(), _scope_all: fd.has("scope_all"),
      _default_type: fd.get("default_type"), _default_value: Number(fd.get("default_value") || 0), _items: items, _admin_note: (fd.get("admin_note") || "").trim() || null });
    if (error) throw error; closeModal(); toast(t("saved")); render();
  },
  "a-payout": async (fd, form) => {
    const { error } = await sb.rpc("admin_affiliate_payout", { _aff_id: form.dataset.id, _amount: parseInt(fd.get("amount"), 10), _method: fd.get("method"), _reference: fd.get("reference") || null, _note: fd.get("note") || null });
    if (error) throw error; toast(t("a_done")); closeModal(); render();
  },
  "a-setpass": async (fd, form) => {
    const { error } = await sb.rpc("admin_set_password", { _user_id: form.dataset.id, _password: fd.get("password") });
    if (error) throw error; closeModal(); toast(t("saved"));
  }
});

/* boot: load campaigns as early as possible */
loadCampaigns().then(() => { renderPromo(); if (document.querySelector(".pprice,.vp,#sum")) render(); });
</script>
